services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: BikeJumillaLab2026!
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - bikejumilla-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  web:
    image: odoo:18.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8070:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: BikeJumillaLab2026!
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    command: odoo --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
    networks:
      - bikejumilla-net


volumes:
  db-data:
  odoo-data:

networks:
  bikejumilla-net:
    driver: bridge